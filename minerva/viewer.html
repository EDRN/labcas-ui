<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>LabCAS Minerva Story</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070a;
    }

    .minerva-stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #05070a;
    }

    #minerva-browser {
      display: none;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .minerva-status,
    .minerva-fallback {
      box-sizing: border-box;
      width: 100%;
      min-height: 100vh;
      padding: 32px;
      color: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #111827;
    }

    .minerva-status {
      display: block;
    }

    .minerva-fallback {
      display: none;
      max-width: 980px;
    }

    .minerva-fallback h5 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 600;
    }

    .minerva-fallback a {
      color: #8ec5ff;
    }

    .minerva-file-list {
      max-height: 260px;
      margin: 16px 0;
      padding-left: 20px;
      overflow: auto;
    }

    .minerva-file-list li {
      margin-bottom: 6px;
      word-break: break-word;
    }

    .minerva-actions .btn {
      display: inline-block;
      margin: 8px 8px 0 0;
      padding: 9px 14px;
      border: 1px solid #8ec5ff;
      border-radius: 4px;
      color: #08111f;
      background: #8ec5ff;
      cursor: pointer;
    }

    .minerva-actions .btn-secondary {
      color: #f5f7fb;
      background: transparent;
    }
  </style>
</head>

<body>
  <main class="minerva-stage">
    <div id="minerva-status" class="minerva-status">Loading Minerva viewer...</div>
    <div id="minerva-browser"></div>
    <div id="minerva-fallback" class="minerva-fallback"></div>
  </main>

  <script src="/labcas-ui/assets/js/labcas/minerva-viewer.js?version=5.5.17"></script>
</body>

</html>
