  <script src="/labcas-ui/assets/js/labcas/utils.js?version=5.5.20"></script>
  <script>
    var minervaStoryFields = [
      'MinervaStoryURL',
      'MinervaStoryUrl',
      'MinervaStory',
      'MinervaExhibitURL',
      'MinervaExhibitUrl',
      'MinervaExhibit',
      'minerva_story_url',
      'minervaStoryUrl',
      'minerva_exhibit_url',
      'exhibit',
      'exhibitUrl'
    ];
    var minervaSessionFields = [
      'MinervaStorySessionURL',
      'MinervaStorySessionUrl',
      'MinervaSessionURL',
      'MinervaSessionUrl',
      'minerva_story_session_url',
      'minerva_session_url'
    ];
    var minervaEntries = [];
    var minervaSamples = [];

    function minervaStorageGet(key, fallback) {
      try {
        if (window.localStorage) {
          var value = window.localStorage.getItem(key);
          return value == null ? fallback : value;
        }
      } catch (e) {}
      return fallback;
    }

    function minervaStorageSet(key, value) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(key, value);
          return true;
        }
      } catch (e) {}
      return false;
    }

    function minervaStorageRemove(key) {
      try {
        if (window.localStorage) {
          window.localStorage.removeItem(key);
        }
      } catch (e) {}
    }

    function minervaEscapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function minervaDecodeRepeated(value) {
      var str = String(value == null ? '' : value).replace(/\+/g, ' ');
      for (var i = 0; i < 4; i += 1) {
        try {
          var decoded = decodeURIComponent(str);
          if (decoded === str) {
            break;
          }
          str = decoded;
        } catch (e) {
          break;
        }
      }
      return str;
    }

    function minervaRemoveLabcasEscapes(value) {
      var id = minervaDecodeRepeated(value);
      var escapedChars = '*?^${}()|[]\\~&!":';
      var normalized = '';
      for (var i = 0; i < id.length; i += 1) {
        if (id[i] === '\\' && i + 1 < id.length && escapedChars.indexOf(id[i + 1]) !== -1) {
          continue;
        }
        normalized += id[i];
      }
      return normalized;
    }

    function minervaNormalizeDownloadId(value) {
      if (typeof normalizeLabcasFileIdForDownload === 'function') {
        return normalizeLabcasFileIdForDownload(value || '');
      }
      return minervaRemoveLabcasEscapes(value || '');
    }

    function minervaBasename(value) {
      var display = minervaRemoveLabcasEscapes(value || '');
      var clean = display.split('?')[0].split('#')[0];
      var parts = clean.split('/');
      return parts[parts.length - 1] || clean || '';
    }

    function minervaFormatFromPath(value) {
      var name = minervaBasename(value).toLowerCase();
      if (name.endsWith('.ome.tif') || name.endsWith('.ome.tiff')) {
        return 'OME-TIFF';
      }
      if (name.endsWith('.qptif') || name.endsWith('.qptiff')) {
        return 'QPTIFF';
      }
      var match = name.match(/\.([a-z0-9]+)$/);
      return match ? match[1].toUpperCase() : '';
    }

    function minervaNormalizeStoredItem(item) {
      if (!item) {
        return null;
      }
      if ($.isArray(item)) {
        return {
          location: item[0] || '',
          name: minervaRemoveLabcasEscapes(item[1] || minervaBasename(item[3])),
          version: item[2] || '',
          id: minervaNormalizeDownloadId(item[3] || ''),
          size: item[4] || '',
          format: minervaFormatFromPath(item[1] || item[3]),
          sourceKind: 'labcas'
        };
      }
      var out = {
        location: item.location || item.FileLocation || '',
        name: minervaRemoveLabcasEscapes(item.name || item.FileName || minervaBasename(item.id || item.url)),
        version: item.version || item.DatasetVersion || '',
        id: minervaNormalizeDownloadId(item.id || item.FileId || item.FileID || ''),
        url: item.url || '',
        size: item.size || item.FileSize || '',
        format: item.format || item.Format || minervaFormatFromPath(item.name || item.FileName || item.id || item.url),
        sourceKind: 'labcas'
      };
      minervaStoryFields.forEach(function(key) {
        if (item[key]) {
          out[key] = item[key];
        }
      });
      minervaSessionFields.forEach(function(key) {
        if (item[key]) {
          out[key] = item[key];
        }
      });
      if (item.metadata) {
        out.metadata = item.metadata;
      }
      return out;
    }

    function minervaNormalizeSample(sample) {
      if (!sample) {
        return null;
      }
      return {
        label: sample.label || sample.name || minervaBasename(sample.exhibit),
        name: sample.label || sample.name || minervaBasename(sample.exhibit),
        format: sample.format || minervaFormatFromPath(sample.source || sample.exhibit),
        exhibit: sample.exhibit || sample.story || '',
        sourcePath: sample.source || '',
        sourceKind: 'sample'
      };
    }

    function minervaReadStoredItems() {
      var items = [];
      var raw = minervaStorageGet('labcas_minerva_files', '') || '[]';
      try {
        var parsed = JSON.parse(raw);
        items = ($.isArray(parsed) ? parsed : []).map(minervaNormalizeStoredItem).filter(Boolean);
      } catch (e) {
        items = [];
      }

      var params = new URLSearchParams(window.location.search);
      var directId = params.get('file_id') || params.get('fileid');
      if (directId) {
        var normalizedId = minervaNormalizeDownloadId(directId);
        var exists = items.some(function(item) {
          return item.id === normalizedId;
        });
        if (!exists) {
          items.unshift({
            id: normalizedId,
            name: minervaRemoveLabcasEscapes(params.get('file_name') || minervaBasename(normalizedId)),
            location: params.get('file_location') || '',
            size: params.get('file_size') || '',
            format: minervaFormatFromPath(params.get('file_name') || normalizedId),
            sourceKind: 'labcas'
          });
        }
      }
      return items;
    }

    function minervaFindStoryUrl(value) {
      if (!value) {
        return '';
      }
      for (var i = 0; i < minervaStoryFields.length; i += 1) {
        var key = minervaStoryFields[i];
        if (value[key]) {
          return String(value[key]);
        }
      }
      if (value.metadata) {
        return minervaFindStoryUrl(value.metadata);
      }
      return '';
    }

    function minervaFindSessionUrl(value) {
      if (!value) {
        return '';
      }
      for (var i = 0; i < minervaSessionFields.length; i += 1) {
        var key = minervaSessionFields[i];
        if (value[key]) {
          return String(value[key]);
        }
      }
      if (value.metadata) {
        return minervaFindSessionUrl(value.metadata);
      }
      return '';
    }

    function minervaCurrentRuntime() {
      var params = new URLSearchParams(window.location.search);
      var fileId = params.get('file_id') || params.get('fileid') || '';
      var directStory = params.get('exhibit') || params.get('story') || '';
      var directSession = params.get('story_session') || params.get('session') || '';
      return {
        story: directStory || (fileId || directSession ? '' : minervaStorageGet('labcas_minerva_story_url', '')),
        session: directSession,
        fileId: fileId ? minervaNormalizeDownloadId(fileId) : '',
        demo: params.get('demo') === '1'
      };
    }

    function minervaQueryForRuntime() {
      var incoming = new URLSearchParams(window.location.search);
      var runtime = new URLSearchParams();
      var current = minervaCurrentRuntime();
      if (current.story) {
        runtime.set('exhibit', current.story);
      }
      if (current.session) {
        runtime.set('story_session', current.session);
      }
      if (current.demo) {
        runtime.set('demo', '1');
      }
      ['file_id', 'fileid', 'file_name', 'file_location', 'file_size'].forEach(function(key) {
        var value = incoming.get(key);
        if (value) {
          runtime.set(key, value);
        }
      });
      return runtime.toString();
    }

    function minervaSetFrame() {
      var frame = document.getElementById('minerva-frame');
      if (!frame) {
        return;
      }
      var query = minervaQueryForRuntime();
      frame.src = '/labcas-ui/minerva/viewer.html' + (query ? '?' + query : '');
    }

    function minervaCurrentExhibit() {
      return minervaCurrentRuntime().story;
    }

    function minervaEntryLabel(entry) {
      return entry ? (entry.label || entry.name || minervaBasename(entry.id || entry.url || entry.exhibit || entry.sourcePath) || 'Pathology image') : '';
    }

    function minervaEntryFormat(entry) {
      return entry ? (entry.format || minervaFormatFromPath(entry.name || entry.id || entry.url || entry.sourcePath || entry.exhibit) || 'Image') : 'Image';
    }

    function minervaEntryKey(entry) {
      var story = minervaFindStoryUrl(entry);
      if (story) {
        return 'story:' + story;
      }
      var session = minervaFindSessionUrl(entry);
      if (session) {
        return 'session:' + session;
      }
      if (entry && entry.id) {
        return 'file:' + entry.id;
      }
      if (entry && entry.url) {
        return 'url:' + entry.url;
      }
      return 'entry:' + minervaEntryLabel(entry);
    }

    function minervaCurrentEntryKey() {
      var current = minervaCurrentRuntime();
      if (current.story) {
        return 'story:' + current.story;
      }
      if (current.session) {
        return 'session:' + current.session;
      }
      if (current.fileId) {
        return 'file:' + current.fileId;
      }
      return '';
    }

    function minervaBuildEntries(samples) {
      var entries = [];
      var seen = {};
      function push(entry) {
        if (!entry) {
          return;
        }
        var key = minervaEntryKey(entry);
        if (seen[key]) {
          return;
        }
        seen[key] = true;
        entries.push(entry);
      }
      minervaReadStoredItems().forEach(push);
      (samples || []).map(minervaNormalizeSample).filter(Boolean).forEach(push);
      return entries;
    }

    function minervaRenderFileList() {
      var list = document.getElementById('minerva-file-list');
      var count = document.getElementById('minerva-file-count');
      if (!list) {
        return;
      }
      list.innerHTML = '';
      var currentKey = minervaCurrentEntryKey();
      var selectedCount = minervaEntries.filter(function(entry) { return entry.sourceKind === 'labcas'; }).length;
      var sampleCount = minervaEntries.filter(function(entry) { return entry.sourceKind === 'sample'; }).length;
      if (count) {
        var labels = [];
        if (selectedCount) {
          labels.push(selectedCount + ' selected');
        }
        if (sampleCount) {
          labels.push(sampleCount + ' prepared');
        }
        count.textContent = labels.length ? labels.join(' / ') : '0 files';
      }
      if (!minervaEntries.length) {
        list.innerHTML = '<div class="minerva-empty">No pathology files are available.</div>';
        return;
      }
      minervaEntries.forEach(function(entry, index) {
        var story = minervaFindStoryUrl(entry);
        var session = minervaFindSessionUrl(entry);
        var button = document.createElement('button');
        var status = story || session ? 'Story' : 'Raw';
        var source = entry.sourceKind === 'sample' ? 'Prepared sample' : 'LabCAS';
        button.type = 'button';
        button.className = 'minerva-file-button ' + (story || session ? 'story-ready' : 'raw-only') + (minervaEntryKey(entry) === currentKey ? ' active' : '');
        button.title = minervaEntryLabel(entry);
        button.innerHTML = [
          '<span class="minerva-file-name">' + minervaEscapeHtml(minervaEntryLabel(entry)) + '</span>',
          '<span class="minerva-file-meta">',
          '<span>' + minervaEscapeHtml(minervaEntryFormat(entry)) + '</span>',
          '<span>' + minervaEscapeHtml(source) + '</span>',
          '<span class="minerva-file-status">' + status + '</span>',
          '</span>'
        ].join('');
        button.addEventListener('click', function() {
          minervaSwitchEntry(index);
        });
        list.appendChild(button);
      });
    }

    function minervaRenderSampleSelect() {
      var select = document.getElementById('minerva-sample-select');
      if (!select) {
        return;
      }
      if (!minervaSamples.length) {
        select.style.display = 'none';
        return;
      }
      select.style.display = '';
      var current = minervaCurrentExhibit();
      select.innerHTML = '<option value="">Prepared samples</option>' + minervaSamples.map(function(sample) {
        var exhibit = sample.exhibit || '';
        var selected = exhibit && exhibit === current ? ' selected' : '';
        return '<option value="' + minervaEscapeHtml(exhibit) + '"' + selected + '>' + minervaEscapeHtml(sample.label || exhibit) + '</option>';
      }).join('');
      select.onchange = function() {
        if (select.value) {
          minervaSwitchExhibit(select.value);
        }
      };
    }

    function minervaSyncControls() {
      minervaRenderFileList();
      minervaRenderSampleSelect();
    }

    function minervaSwitchExhibit(exhibit) {
      if (!exhibit) {
        return;
      }
      for (var i = 0; i < minervaEntries.length; i += 1) {
        if (minervaFindStoryUrl(minervaEntries[i]) === exhibit) {
          minervaSwitchEntry(i);
          return;
        }
      }
      minervaStorageSet('labcas_minerva_story_url', exhibit);
      var params = new URLSearchParams(window.location.search);
      params.set('exhibit', exhibit);
      params.delete('story');
      params.delete('story_session');
      params.delete('session');
      params.delete('demo');
      params.delete('file_id');
      params.delete('fileid');
      params.delete('file_name');
      params.delete('file_location');
      params.delete('file_size');
      window.history.replaceState(null, document.title, window.location.pathname + '?' + params.toString());
      minervaSetFrame();
      minervaSyncControls();
    }

    function minervaSwitchEntry(index) {
      var entry = minervaEntries[index];
      if (!entry) {
        return;
      }
      var params = new URLSearchParams(window.location.search);
      ['exhibit', 'story', 'story_session', 'session', 'demo', 'file_id', 'fileid', 'file_name', 'file_location', 'file_size'].forEach(function(key) {
        params.delete(key);
      });
      var story = minervaFindStoryUrl(entry);
      var session = minervaFindSessionUrl(entry);
      if (story) {
        minervaStorageSet('labcas_minerva_story_url', story);
        params.set('exhibit', story);
      } else if (session) {
        minervaStorageRemove('labcas_minerva_story_url');
        params.set('story_session', session);
      } else {
        minervaStorageRemove('labcas_minerva_story_url');
        if (entry.id) {
          params.set('file_id', entry.id);
        }
        if (entry.name) {
          params.set('file_name', entry.name);
        }
        if (entry.location) {
          params.set('file_location', entry.location);
        }
        if (entry.size) {
          params.set('file_size', entry.size);
        }
      }
      var query = params.toString();
      window.history.replaceState(null, document.title, window.location.pathname + (query ? '?' + query : ''));
      minervaSetFrame();
      minervaSyncControls();
    }

    function minervaSelectInitialEntry() {
      var currentKey = minervaCurrentEntryKey();
      if (currentKey) {
        for (var i = 0; i < minervaEntries.length; i += 1) {
          if (minervaEntryKey(minervaEntries[i]) === currentKey) {
            minervaSetFrame();
            minervaSyncControls();
            return;
          }
        }
        minervaSetFrame();
        minervaSyncControls();
        return;
      }
      if (minervaCurrentRuntime().demo) {
        minervaSetFrame();
        minervaSyncControls();
        return;
      }
      if (minervaEntries.length) {
        minervaSwitchEntry(0);
        return;
      }
      minervaSetFrame();
      minervaSyncControls();
    }

    function minervaLoadSamples() {
      var select = document.getElementById('minerva-sample-select');
      if (!select || typeof fetch !== 'function') {
        minervaEntries = minervaBuildEntries([]);
        minervaSelectInitialEntry();
        return;
      }
      fetch('/labcas-ui/minerva/samples.json?version=5.5.3')
        .then(function(response) { return response.ok ? response.json() : []; })
        .then(function(samples) {
          minervaSamples = $.isArray(samples) ? samples : [];
          minervaEntries = minervaBuildEntries(minervaSamples);
          minervaSelectInitialEntry();
        })
        .catch(function() {
          minervaSamples = [];
          minervaEntries = minervaBuildEntries([]);
          minervaSelectInitialEntry();
        });
    }

    function minervaBindFrameMessages() {
      window.addEventListener('message', function(event) {
        if (!event.data || !event.data.href) {
          return;
        }
        try {
          var next = new URL(event.data.href);
          if (next.origin !== window.location.origin || next.pathname.indexOf('/labcas-ui/minerva/viewer.html') !== 0) {
            return;
          }
          window.history.replaceState(null, document.title, window.location.pathname + window.location.search + next.hash);
        } catch (e) {}
      });
    }

    function minervaBindStandalone() {
      var button = document.getElementById('minerva-open-standalone');
      if (!button) {
        return;
      }
      button.onclick = function() {
        var frame = document.getElementById('minerva-frame');
        var href = frame && frame.src ? frame.src : '/labcas-ui/minerva/viewer.html';
        window.open(href, '_blank', 'noopener');
      };
    }

    $(document).ready(function() {
      if (typeof initCookies === 'function') {
        initCookies();
      } else if (!Cookies.get('user')) {
        Cookies.set('user', 'Sign in');
      }
      $('#head_template').load('/labcas-ui/templates.html #head_template');
      $('#nav_template').load('/labcas-ui/templates.html?version=5.5.2 #nav_template', function() {
        $('#username_placeholder_second').text(Cookies.get('user'));
        if (Cookies.get('user') == 'Sign in') {
          $('#username_placeholder_third').text(Cookies.get('user'));
          $('#loggedout_msg').show();
        } else {
          $('#loggedout_msg').hide();
        }
        try { set_cart_status(); } catch(e) {}
      });
      var environmentName = minervaStorageGet('environment_name', 'edrn');
      $('#footer_template').load('/labcas-ui/templates.html?version=5.5.2 #footer_template_' + environmentName);
      $('#sidebar_placeholder').load('/labcas-ui/sidebar_' + environmentName + '.html?version=5.5.2');
      $('#breadcrumb').html('<li class="breadcrumb-item"><a href="/labcas-ui/m/index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Minerva Viewer</li>');
      minervaBindFrameMessages();
      minervaLoadSamples();
      minervaBindStandalone();
    });
  </script>
</body>

</html>
